# Desarrollo local: recarga automática del backend con el código montado.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: "no"
    volumes:
      - ./backend:/app
      # Los datos locales quedan en backend/data/ del repositorio, como antes.
      - ./backend/data:/app/data

  frontend:
    restart: "no"
